name: UI Smoke

# Compile-only CI cannot catch the failure mode that actually hurts here: a screen that
# renders letterboxed, cropped, clipped or blank. This lane boots a real simulator, seeds it
# with a synthetic photo library, then drives the app through every surface with XCUITest and
# uploads a screenshot of each one.
#
# The UI test is also what answers the photo-library permission alert: `simctl privacy grant
# photos` does not actually grant access on current runtimes, so without automation the app
# sits behind a system dialog and every screen photographs empty.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.justpainful.Memories

jobs:
  smoke:
    name: Drive the app and photograph it
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 Scripts/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Seed a synthetic photo library
        run: |
          set -euo pipefail
          # The runner's python is externally managed (PEP 668), so pip needs its own venv.
          python3 -m venv /tmp/seedenv
          /tmp/seedenv/bin/pip install --quiet --disable-pip-version-check Pillow piexif

          # The fixture includes short video clips. The macOS runner image ships no ffmpeg and
          # `brew install ffmpeg` costs minutes on a lane that runs in ten, so the seed script
          # writes Motion JPEG QuickTime files itself out of Pillow frames — nothing to
          # install. This line only records which tool was actually available.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg is present but not used; clips come from Scripts/make_seed_photos.py"
          else
            echo "no ffmpeg on this runner, as expected; clips come from Scripts/make_seed_photos.py"
          fi

          # simctl addmedia costs seconds per asset, so the fixture is kept just big enough to
          # exercise anniversaries, a dense evening, a burst of near-duplicates, three GPS
          # clusters (one far enough away to read as a trip), messaging-app filenames and a
          # handful of videos whose container date disagrees with their file date.
          /tmp/seedenv/bin/python Scripts/make_seed_photos.py --out /tmp/seed --count 60

          # Split by extension rather than globbing `*.jpg`: the stills are deliberately named
          # the way a camera roll names them (IMG_0042.JPG) and the clips are .MOV, so a
          # single lowercase glob would silently seed a fraction of the fixture.
          photos=(); videos=()
          for file in /tmp/seed/*; do
            case "${file##*.}" in
              mov|MOV|mp4|MP4) videos+=("$file") ;;
              *)               photos+=("$file") ;;
            esac
          done

          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl addmedia "$udid" "${photos[@]}"
          # Videos go in separately and non-fatally. A clip Photos refuses to import must not
          # cost the run every screenshot after it — but it must be loud, because a silent
          # failure here would leave the video surfaces untested while CI still went green.
          if ! xcrun simctl addmedia "$udid" "${videos[@]}"; then
            echo "::warning::simctl refused one or more seed videos; the video badge, the player and the recording-date recovery are untested in this run"
          fi
          echo "seeded ${#photos[@]} photos and ${#videos[@]} videos"

      - name: Run the UI tour
        run: |
          set -o pipefail
          xcodebuild test \
            -project Memories.xcodeproj \
            -scheme Memories \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build \
            -resultBundlePath Result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -n 60

      - name: Export screenshots
        if: always()
        run: |
          set -euo pipefail
          mkdir -p Attachments Screenshots

          # Non-fatal, but not silent. This used to redirect everything to /dev/null, which is
          # how the export quietly stopped producing the names the screenshots are keyed by
          # without anyone noticing for several runs.
          xcrun xcresulttool export attachments \
            --path Result.xcresult \
            --output-path Attachments || echo "::warning::xcresulttool could not export attachments"

          # The export mixes images with logs and extension-less blobs; upload only the
          # named screenshots so the artifact is readable and the upload is predictable.
          python3 Scripts/flatten_attachments.py Attachments Screenshots
          ls -la Screenshots

      - name: Check for crash reports
        if: always()
        run: |
          set -euo pipefail
          dev="$HOME/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}"
          crashes=$(find "$dev/data/Library/Logs" -name "Memories-*.ips" 2>/dev/null || true)
          if [ -n "$crashes" ]; then
            echo "::error::App crashed during the tour"
            for c in $crashes; do echo "--- $c ---"; head -n 50 "$c"; done
            exit 1
          fi
          echo "No crash reports."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots
          retention-days: 14
